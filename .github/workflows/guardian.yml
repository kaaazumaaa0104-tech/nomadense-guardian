name: NOMADENSE Guardian

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        client:
          - name: yoshiko-mirai
            label: "よしこBot（ミライ工務店）"
            url: https://outstanding-illumination-production-3225.up.railway.app
            railway_service: outstanding-illumination
          # 新クライアント追加例:
          # - name: bot-client2
          #   label: "XXBot（YY会社）"
          #   url: https://your-service.up.railway.app
          #   railway_service: your-service-name

    steps:
      - name: Health check
        id: check
        run: |
          HTTP_CODE=$(curl -s -o /tmp/health_body.txt -w "%{http_code}" \
            --max-time 20 "${{ matrix.client.url }}/healthz/deep" || echo "000")
          echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT
          echo "client=${{ matrix.client.label }}" >> $GITHUB_OUTPUT
          echo "[[${{ matrix.client.name }}]] HTTP: $HTTP_CODE"
          cat /tmp/health_body.txt

      - name: All good
        if: steps.check.outputs.http_code == '200'
        run: echo "OK - ${{ matrix.client.label }}"

      - name: Install Railway CLI
        if: steps.check.outputs.http_code != '200'
        run: |
          curl -fsSL https://railway.app/install.sh | sh
          echo "$HOME/.railway/bin" >> $GITHUB_PATH

      - name: Railway redeploy
        if: steps.check.outputs.http_code != '200'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway redeploy --service "${{ matrix.client.railway_service }}" --yes 2>&1

      - name: Notify failure + redeploy
        if: steps.check.outputs.http_code != '200'
        run: |
          ERRORS=$(python3 -c "
          import json
          try:
              d = json.load(open('/tmp/health_body.txt'))
              print(', '.join(d.get('errors', ['unknown error'])))
          except Exception:
              print('no response')
          " 2>/dev/null || echo "no response")
          CLIENT="${{ matrix.client.label }}"
          CODE="${{ steps.check.outputs.http_code }}"
          MSG="${CLIENT} 障害検知 -> 自動復旧中\nエラー: ${ERRORS}\nHTTP: ${CODE}\nRailway再デプロイ実行済み。3分後に復旧確認します。"
          curl -s -X POST https://api.line.me/v2/bot/message/push \
            -H "Authorization: Bearer ${{ secrets.MONITORING_LINE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"to\":\"${{ secrets.SAIKI_LINE_UID }}\",\"messages\":[{\"type\":\"text\",\"text\":\"${MSG}\"}]}"

      - name: Wait 3 min
        if: steps.check.outputs.http_code != '200'
        run: sleep 180

      - name: Recovery check
        if: steps.check.outputs.http_code != '200'
        id: recovery
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 20 "${{ matrix.client.url }}/healthz" || echo "000")
          echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT
          echo "Recovery: $HTTP_CODE"

      - name: Notify recovered
        if: steps.check.outputs.http_code != '200' && steps.recovery.outputs.http_code == '200'
        run: |
          CLIENT="${{ matrix.client.label }}"
          curl -s -X POST https://api.line.me/v2/bot/message/push \
            -H "Authorization: Bearer ${{ secrets.MONITORING_LINE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"to\":\"${{ secrets.SAIKI_LINE_UID }}\",\"messages\":[{\"type\":\"text\",\"text\":\"${CLIENT} 復旧しました\n\n自動再デプロイで回復しました。\"}]}"

      - name: Notify manual action needed
        if: steps.check.outputs.http_code != '200' && steps.recovery.outputs.http_code != '200'
        run: |
          CLIENT="${{ matrix.client.label }}"
          CODE="${{ steps.recovery.outputs.http_code }}"
          MSG="${CLIENT} 自動復旧失敗\n\n再デプロイ後も応答なし。手動確認が必要です。\nRailway: https://railway.app\nHTTP: ${CODE}"
          curl -s -X POST https://api.line.me/v2/bot/message/push \
            -H "Authorization: Bearer ${{ secrets.MONITORING_LINE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"to\":\"${{ secrets.SAIKI_LINE_UID }}\",\"messages\":[{\"type\":\"text\",\"text\":\"${MSG}\"}]}"
          exit 1
